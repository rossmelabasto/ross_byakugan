<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#11111b">
  <title>byakugan</title>
  <style>
    :root {
      --crust: #0b0b13;
      --bg: #11111b;
      --card: #1a1a28;
      --card2: #1e1e2e;
      --line: #2a2b3d;
      --tx: #cdd6f4;
      --sub: #a6adc8;
      --mut: #7f849c;
      --ac: #a6e3a1;
      --ac2: #94e2d5;
      --vi: #cba6f7;
      --bad: #f38ba8;
      --warn: #f9e2af;
      --blue: #89b4fa;
      --r: 14px
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      background: radial-gradient(1200px 600px at 80% -10%, #1d1b30 0, transparent 60%), var(--bg);
      color: var(--tx);
      font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased
    }

    button,
    input,
    select {
      font: inherit;
      color: var(--tx)
    }

    button {
      cursor: pointer
    }

    .hide {
      display: none !important
    }

    #app {
      display: grid;
      grid-template-columns: 230px 1fr;
      min-height: 100%
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 20px 14px;
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, #14141f, #0f0f18);
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px 18px;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: .2px
    }

    .brand .logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      color: #0b0b13
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 0;
      background: none;
      color: var(--sub);
      text-align: left;
      width: 100%;
      transition: .15s
    }

    .nav:hover {
      background: #1c1c2b;
      color: var(--tx)
    }

    .nav.on {
      background: linear-gradient(90deg, #26304a55, #a6e3a122);
      color: var(--ac);
      box-shadow: inset 2px 0 var(--ac)
    }

    .grow {
      flex: 1
    }

    .side-foot {
      font-size: 12px;
      color: var(--mut);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    main {
      padding: 28px clamp(16px, 3vw, 40px) 60px;
      max-width: 1180px;
      width: 100%;
      margin: 0 auto
    }

    .top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
      flex-wrap: wrap
    }

    h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: -.2px
    }

    .sub {
      color: var(--mut)
    }

    .live {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--mut);
      font-size: 12px
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--ac);
      box-shadow: 0 0 0 0 #a6e3a188;
      animation: pulse 2s infinite
    }

    @keyframes pulse {
      70% {
        box-shadow: 0 0 0 9px #a6e3a100
      }

      100% {
        box-shadow: 0 0 0 0 #a6e3a100
      }
    }

    .grid {
      display: grid;
      gap: 14px
    }

    .g4 {
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr))
    }

    .g2 {
      grid-template-columns: 2fr 1fr
    }

    .gdev {
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr))
    }

    @media(max-width:900px) {
      .g2 {
        grid-template-columns: 1fr
      }
    }

    .card {
      background: linear-gradient(180deg, var(--card2), var(--card));
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 18px;
      position: relative;
      overflow: hidden
    }

    .stat .ico {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      margin-bottom: 12px
    }

    .stat .n {
      font-size: 30px;
      font-weight: 750;
      letter-spacing: -.5px;
      line-height: 1.1
    }

    .stat .l {
      color: var(--mut);
      font-size: 12.5px;
      margin-top: 4px
    }

    .card h3 {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: .8px
    }

    .chart {
      position: relative;
      height: 190px
    }

    .chart svg {
      width: 100%;
      height: 100%;
      overflow: visible
    }

    .tip {
      position: absolute;
      pointer-events: none;
      background: #0b0b13ee;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 12px;
      white-space: nowrap;
      transform: translate(-50%, -120%);
      opacity: 0;
      transition: opacity .1s
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 9px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 600;
      border: 1px solid transparent
    }

    .b-free {
      background: #7f849c22;
      color: var(--sub);
      border-color: #7f849c44
    }

    .b-pro {
      background: #89b4fa22;
      color: var(--blue);
      border-color: #89b4fa55
    }

    .b-unlimited {
      background: #cba6f722;
      color: var(--vi);
      border-color: #cba6f755
    }

    .b-ok {
      background: #a6e3a118;
      color: var(--ac);
      border-color: #a6e3a144
    }

    .b-bad {
      background: #f38ba818;
      color: var(--bad);
      border-color: #f38ba844
    }

    .b-warn {
      background: #f9e2af18;
      color: var(--warn);
      border-color: #f9e2af44
    }

    .bar {
      height: 7px;
      border-radius: 99px;
      background: #0b0b1366;
      overflow: hidden;
      border: 1px solid var(--line)
    }

    .bar i {
      display: block;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--ac), var(--ac2))
    }

    .bar.hot i {
      background: linear-gradient(90deg, var(--warn), var(--bad))
    }

    .bar.inf i {
      width: 100%;
      background: linear-gradient(90deg, var(--vi), var(--blue))
    }

    .dev {
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: .15s
    }

    .dev:hover {
      border-color: #3b3d57;
      transform: translateY(-1px)
    }

    .dev.off {
      opacity: .62
    }

    .dev .hd {
      display: flex;
      gap: 12px;
      align-items: center
    }

    .av {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 16px;
      color: #0b0b13;
      flex: none
    }

    .dev .nm {
      font-weight: 650;
      font-size: 15px
    }

    .dev .md {
      color: var(--mut);
      font-size: 12px
    }

    .dev .st {
      margin-left: auto;
      text-align: right;
      font-size: 12px;
      color: var(--mut);
      white-space: nowrap
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mut);
      margin-right: 6px
    }

    .dot.live {
      background: var(--ac);
      box-shadow: 0 0 8px var(--ac)
    }

    .dot.off {
      background: var(--bad)
    }

    .q {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--sub);
      margin-bottom: 6px
    }

    .acts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .btn {
      border: 1px solid var(--line);
      background: #ffffff08;
      padding: 7px 12px;
      border-radius: 9px;
      transition: .15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px
    }

    .btn:hover {
      background: #ffffff12;
      border-color: #3b3d57
    }

    .btn.pri {
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      color: #0b0b13;
      border: 0;
      font-weight: 650
    }

    .btn.pri:hover {
      filter: brightness(1.07)
    }

    .btn.bad {
      color: var(--bad)
    }

    .btn.bad:hover {
      background: #f38ba818;
      border-color: #f38ba855
    }

    select,
    input {
      background: #0b0b1355;
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 8px 11px;
      outline: none
    }

    select:focus,
    input:focus {
      border-color: var(--ac)
    }

    .qs {
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .qc .meta {
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--mut);
      font-size: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap
    }

    .bub {
      padding: 10px 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: anywhere
    }

    .bub.q1 {
      background: #ffffff09;
      color: var(--sub);
      border-top-left-radius: 4px
    }

    .bub.a1 {
      margin-top: 8px;
      background: linear-gradient(135deg, #a6e3a114, #94e2d50d);
      border: 1px solid #a6e3a133;
      border-top-left-radius: 4px
    }

    .ans {
      font-weight: 700;
      font-size: 16px;
      color: var(--ac)
    }

    .exp {
      color: var(--sub);
      margin-top: 6px;
      font-size: 13px
    }

    .tools {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .tools input {
      flex: 1;
      min-width: 200px
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th {
      color: var(--mut);
      font-weight: 500;
      text-align: left;
      font-size: 12px;
      padding: 0 10px 10px;
      text-transform: uppercase;
      letter-spacing: .6px
    }

    td {
      padding: 12px 10px;
      border-top: 1px solid var(--line)
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace
    }

    .code {
      font: 800 26px ui-monospace, monospace;
      letter-spacing: 2px;
      color: var(--warn);
      user-select: all;
      text-align: center;
      padding: 16px;
      background: #0b0b13;
      border-radius: 12px;
      border: 1px dashed #f9e2af55
    }

    .veil {
      position: fixed;
      inset: 0;
      background: #0008;
      backdrop-filter: blur(4px);
      display: grid;
      place-items: center;
      z-index: 50;
      padding: 16px;
      animation: fade .15s
    }

    @keyframes fade {
      from {
        opacity: 0
      }
    }

    .modal {
      background: var(--card2);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px;
      width: min(420px, 100%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: pop .18s
    }

    @keyframes pop {
      from {
        transform: scale(.96);
        opacity: 0
      }
    }

    .modal h2 {
      margin: 0;
      font-size: 17px
    }

    #toasts {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 60
    }

    .toast {
      background: #0b0b13;
      border: 1px solid var(--line);
      border-left: 3px solid var(--ac);
      padding: 10px 14px;
      border-radius: 10px;
      animation: pop .2s;
      max-width: 320px
    }

    .toast.err {
      border-left-color: var(--bad)
    }

    .empty {
      text-align: center;
      color: var(--mut);
      padding: 40px 10px
    }

    .empty svg {
      opacity: .5;
      margin-bottom: 8px
    }

    .sk {
      border-radius: var(--r);
      height: 110px;
      background: linear-gradient(90deg, var(--card) 0, #232337 50%, var(--card) 100%);
      background-size: 200% 100%;
      animation: sk 1.2s infinite
    }

    @keyframes sk {
      to {
        background-position: -200% 0
      }
    }

    #login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px
    }

    .lg {
      width: min(360px, 100%);
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      text-align: center
    }

    .lg .logo {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--ac), var(--ac2));
      color: #0b0b13;
      box-shadow: 0 10px 40px #a6e3a133
    }

    .lg input {
      width: 100%;
      padding: 12px 14px
    }

    .lg .btn {
      width: 100%;
      justify-content: center;
      padding: 12px
    }

    @media(max-width:760px) {
      #app {
        grid-template-columns: 1fr
      }

      aside {
        position: fixed;
        top: auto;
        bottom: 0;
        left: 0;
        right: 0;
        height: auto;
        flex-direction: row;
        padding: 6px;
        z-index: 40;
        border-right: 0;
        border-top: 1px solid var(--line);
        justify-content: space-around
      }

      .brand,
      .side-foot,
      .grow {
        display: none
      }

      .nav {
        flex-direction: column;
        gap: 2px;
        font-size: 11px;
        padding: 7px 4px;
        justify-content: center;
        align-items: center;
        width: auto;
        flex: 1
      }

      .nav.on {
        box-shadow: none
      }

      main {
        padding-bottom: 90px
      }

      .live {
        display: none
      }
    }

  </style>
</head>

<body>
  <div id="login" class="hide">
    <form class="lg" id="lf">
      <div class="logo" id="lglogo"></div>
      <h1>byakugan</h1>
      <div class="sub">Panel de administración</div>
      <input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="btn pri"
        id="go" type="submit">Entrar</button>
      <div id="err" style="color:var(--bad);min-height:18px"></div>
    </form>
  </div>
  <div id="app" class="hide">
    <aside id="side"></aside>
    <main>
      <div class="top">
        <div>
          <h1 id="title"></h1>
          <div class="sub" id="subt"></div>
        </div>
        <div class="live"><span class="pulse"></span><span id="upd">en vivo</span></div>
      </div>
      <div id="view"></div>
    </main>
  </div>
  <div id="toasts"></div>
  <script>
    const $ = (s) => document.querySelector(s);
    function h(tag, props, ...kids) {
      const e = document.createElement(tag); for (const [k, v] of Object.entries(props || {})) { if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn); else if (k === 'class') e.className = v; else if (k === 'style') e.style.cssText = v; else e[k] = v }
      for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); return e
    }
    const IC = {
      eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
      home: '<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
      phone: '<rect x="6" y="2" width="12" height="20" rx="3"/><path d="M11 18h2"/>',
      chat: '<path d="M21 12a8 8 0 0 1-11.5 7.2L4 21l1.8-5.3A8 8 0 1 1 21 12z"/>',
      key: '<circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M16 7l3 3"/>',
      out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
      zap: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>', bolt: '<path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5"/>',
      plus: '<path d="M12 5v14M5 12h14"/>', copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>',
      edit: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>', inf: '<path d="M18.2 8.5a4 4 0 1 0 0 7c2-1.4 2.8-3.4 4-3.5-1.2-.1-2-2-4-3.5zM5.8 15.5a4 4 0 1 0 0-7c-2 1.4-2.8 3.4-4 3.5 1.2.1 2 2 4 3.5z" transform="translate(0)"/>',
      users: '<circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0 1 14 0M17 4.5a3.5 3.5 0 0 1 0 7M22 21a6 6 0 0 0-4-5.6"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>', tok: '<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>',
      stealth: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4L12 14.01l-3-3"/>'
    };
    function icon(n, s = 18) { const w = document.createElement('span'); w.style.display = 'inline-flex'; w.innerHTML = `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`; return w }
    $('#lglogo').append(icon('eye', 32));
    async function api(path, method = 'GET', body) {
      const r = await fetch('/admin/api' + path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
      if (r.status === 401) { showLogin(); throw new Error('401') } const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j
    }
    function toast(msg, err) { const t = h('div', { class: 'toast' + (err ? ' err' : '') }, msg); $('#toasts').append(t); setTimeout(() => t.remove(), 3200) }
    function modal(title, ...body) {
      return new Promise(res => {
        const close = (v) => { veil.remove(); res(v) };
        const veil = h('div', { class: 'veil', on: { click: e => e.target === veil && close(null) } }, h('div', { class: 'modal' }, h('h2', {}, title), ...body.map(b => typeof b === 'function' ? b(close) : b))); document.body.append(veil)
      })
    }
    const ago = (t) => { if (!t) return 'nunca'; const s = (Date.now() - t) / 1000; return s < 90 ? 'ahora' : s < 3600 ? Math.round(s / 60) + ' min' : s < 86400 ? Math.round(s / 3600) + ' h' : Math.round(s / 86400) + ' d' };
    const fmt = (t) => t ? new Date(t).toLocaleString('es-BO', { dateStyle: 'short', timeStyle: 'short' }) : '—';
    const nf = (n) => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e4 ? (n / 1e3).toFixed(1) + 'k' : String(n);
    const HUES = ['#a6e3a1', '#94e2d5', '#89b4fa', '#cba6f7', '#f5c2e7', '#fab387', '#f9e2af'];
    const hue = (s) => HUES[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % HUES.length];
    const planBadge = (p) => h('span', { class: 'badge b-' + p }, p === 'unlimited' ? icon('inf', 13) : null, p);
    function splitAnswer(t) { t = String(t).replace(/\*\*/g, ''); const m = t.match(/^\s*Respuesta:\s*([\s\S]*?)(?:\n+\s*Explicaci[oó]n:\s*([\s\S]*))?$/i); return m ? { a: m[1].trim(), e: (m[2] || '').trim() } : { a: t.trim(), e: '' } }
    function showLogin() { $('#app').classList.add('hide'); $('#login').classList.remove('hide'); $('#pw').focus() }
    $('#lf').onsubmit = async (e) => {
      e.preventDefault(); const r = await fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('#pw').value }) });
      if (r.ok) { $('#pw').value = ''; $('#err').textContent = ''; start() } else $('#err').textContent = (await r.json()).error
    };
    const TABS = {
      resumen: ['Resumen', 'Actividad de los últimos 14 días', 'home', viewResumen],
      dispositivos: ['Dispositivos', 'Quién tiene acceso y cuánto usa', 'phone', viewDevices],
      consultas: ['Consultas', 'Lo que se preguntó y lo que respondió la IA', 'chat', viewQueries],
      invitaciones: ['Invitaciones', 'Códigos para dar acceso', 'key', viewInvites],
      stealth: ['Stealth', 'Configuración mágica IMC', 'stealth', viewStealth]
    };
    let cur = location.hash.slice(1) in TABS ? location.hash.slice(1) : 'resumen', timer;
    function sidebar() {

    function chart(days) {
