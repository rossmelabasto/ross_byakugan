<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>·</title>
<style>
:root{--bg:#11111b;--card:#1e1e2e;--line:#313244;--tx:#cdd6f4;--mut:#7f849c;--ac:#a6e3a1;--bad:#f38ba8;--warn:#f9e2af}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px system-ui,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{margin-right:12px}button,input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.on,button.pri{background:var(--ac);color:#11111b;border-color:var(--ac)}button.bad{color:var(--bad)}
main{padding:16px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.card .n{font-size:28px;font-weight:700}.mut{color:var(--mut)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:500}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--mut);margin-right:6px}.dot.live{background:var(--ac)}.dot.off{background:var(--bad)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin-top:10px}.bars div{flex:1;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
pre{white-space:pre-wrap;margin:4px 0 0;font:inherit;color:var(--mut)}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
#login{max-width:320px;margin:20vh auto;display:flex;flex-direction:column;gap:10px}.hide{display:none!important}
.code{font:700 20px ui-monospace,monospace;color:var(--warn);user-select:all}
</style></head><body>
<div id="login" class="hide"><input id="pw" type="password" placeholder="••••••••" autocomplete="current-password"><button class="pri" id="go">Entrar</button><div id="err" class="mut"></div></div>
<div id="app" class="hide">
<header><b>👁 byakugan</b><span id="tabs"></span><span style="flex:1"></span><button id="out">Salir</button></header>
<main id="view"></main></div>
<script>
const $=(s)=>document.querySelector(s);
// Todo el contenido dinámico se inserta con textContent: los prompts y alias son datos no confiables.
function h(tag,props,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props||{})){if(k==='on')for(const[ev,fn]of Object.entries(v))e.addEventListener(ev,fn);else if(k==='class')e.className=v;else e[k]=v}
 for(const c of kids.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(c));return e}
async function api(path,method='GET',body){const r=await fetch('/admin/api'+path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
 if(r.status===401){showLogin();throw new Error('401')}const j=await r.json();if(!r.ok)throw new Error(j.error||r.status);return j}
const ago=(t)=>{if(!t)return'nunca';const s=(Date.now()-t)/1000;return s<90?'ahora':s<3600?Math.round(s/60)+' min':s<86400?Math.round(s/3600)+' h':Math.round(s/86400)+' d'};
const fmt=(t)=>t?new Date(t).toLocaleString('es-BO',{dateStyle:'short',timeStyle:'short'}):'—';
function showLogin(){$('#app').classList.add('hide');$('#login').classList.remove('hide');$('#pw').focus()}
async function login(){const r=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('#pw').value})});
 if(r.ok){$('#pw').value='';$('#err').textContent='';start()}else $('#err').textContent=(await r.json()).error}
$('#go').onclick=login;$('#pw').onkeydown=(e)=>e.key==='Enter'&&login();
$('#out').onclick=async()=>{await fetch('/admin/logout',{method:'POST'});showLogin()};
const tabs={resumen:viewResumen,dispositivos:viewDevices,consultas:viewQueries,invitaciones:viewInvites};let cur='resumen',timer;
function nav(t){cur=t;clearInterval(timer);const tb=$('#tabs');tb.replaceChildren(...Object.keys(tabs).map(k=>h('button',{class:k===cur?'on':'',on:{click:()=>nav(k)}},k)));
 const run=()=>tabs[cur]().catch(e=>{if(e.message!=='401')$('#view').replaceChildren(h('p',{class:'mut'},e.message))});run();if(cur==='resumen'||cur==='dispositivos')timer=setInterval(run,15000)}
async function start(){$('#login').classList.add('hide');$('#app').classList.remove('hide');nav(cur)}
async function viewResumen(){const o=await api('/overview');const max=Math.max(1,...o.days.map(d=>d.count));
 $('#view').replaceChildren(h('div',{class:'grid'},
  ...[['Activos ahora',o.activeNow],['Dispositivos',o.enabled+' / '+o.devices],['Consultas hoy',o.today.count],['Tokens hoy',o.today.tokens]].map(([l,n])=>h('div',{class:'card'},h('div',{class:'mut'},l),h('div',{class:'n'},String(n))))),
  h('div',{class:'card',style:'margin-top:12px'},h('div',{class:'mut'},'Consultas por día (14 d)'),
   h('div',{class:'bars',style:'margin-bottom:22px'},...o.days.map(d=>{const b=h('div',{title:d.day+': '+d.count+' consultas, '+d.tokens+' tokens',style:'height:'+Math.max(2,d.count/max*100)+'%'});b.append(h('span',{},d.day.slice(8)));return b}))))}
async function viewDevices(){const ds=await api('/devices');
 const act=async(id,body)=>{await api('/devices/'+id,'PATCH',body);viewDevices()};
 $('#view').replaceChildren(h('table',{},h('thead',{},h('tr',{},...['Alias','Equipo','Plan','Hoy','Visto',''].map(x=>h('th',{},x)))),
  h('tbody',{},...ds.map(d=>{const live=Date.now()-(d.lastSeen||0)<300000;
   return h('tr',{},h('td',{},h('span',{class:'dot '+(!d.active?'off':live?'live':'')}),d.alias,h('div',{class:'mut'},d.id.slice(0,6))),
    h('td',{class:'mut'},[d.meta?.manufacturer,d.meta?.model].filter(Boolean).join(' ')+(d.meta?.androidVersion?' · A'+d.meta.androidVersion:'')),
    h('td',{},(()=>{const s=h('select',{on:{change:e=>act(d.id,{plan:e.target.value})}},...['free','pro'].map(p=>h('option',{value:p,selected:p===d.plan},p)));return s})()),
    h('td',{},d.usedToday+' / '+d.limit,' ',h('button',{title:'Cambiar límite diario',on:{click:()=>{const v=prompt('Límite diario (vacío = el del plan)',d.dailyLimit??'');if(v===null)return;act(d.id,{dailyLimit:v===''?null:parseInt(v)})}}},'✎')),
    h('td',{class:'mut',title:fmt(d.lastSeen)},ago(d.lastSeen)),
    h('td',{},h('button',{class:d.active?'bad':'',on:{click:()=>act(d.id,{active:!d.active})}},d.active?'Suspender':'Activar')))}))))}
async function viewQueries(){const rows=await api('/queries?limit=100');
 $('#view').replaceChildren(h('table',{},h('thead',{},h('tr',{},...['Cuándo','Dispositivo','Pregunta y respuesta'].map(x=>h('th',{},x)))),
  h('tbody',{},...rows.map(q=>h('tr',{},h('td',{class:'mut'},fmt(q.createdAt),h('div',{},q.ms+' ms · '+q.tokens+' t')),h('td',{},q.alias),
   h('td',{},h('b',{},q.prompt.length>400?q.prompt.slice(0,400)+'…':q.prompt),h('pre',{},q.response)))))))}
async function viewInvites(){const inv=await api('/invites');
 const label=h('input',{placeholder:'Para quién (etiqueta)'}),plan=h('select',{},h('option',{},'free'),h('option',{},'pro')),uses=h('input',{type:'number',value:1,min:1,max:100,style:'width:70px',title:'Usos'}),days=h('input',{type:'number',placeholder:'días',style:'width:80px',title:'Caduca en N días (vacío = nunca)'});
 const out=h('div');
 const create=async()=>{const r=await api('/invites','POST',{label:label.value,plan:plan.value,maxUses:+uses.value,expiresDays:+days.value});
  out.replaceChildren(h('div',{class:'card'},h('div',{class:'mut'},'Código (solo se muestra ahora):'),h('div',{class:'code'},r.code)));label.value=''};
 $('#view').replaceChildren(h('div',{class:'row'},label,plan,uses,days,h('button',{class:'pri',on:{click:create}},'Crear')),out,
  h('table',{},h('thead',{},h('tr',{},...['Etiqueta','Código','Plan','Usos','Caduca','Estado',''].map(x=>h('th',{},x)))),
   h('tbody',{},...inv.map(i=>h('tr',{},h('td',{},i.label||'—'),h('td',{class:'mut'},'BYA-····-'+i.hint),h('td',{},i.plan),h('td',{},i.uses+' / '+i.maxUses),h('td',{class:'mut'},i.expiresAt?fmt(i.expiresAt):'nunca'),
    h('td',{},i.active?'activa':'revocada'),h('td',{},i.active?h('button',{class:'bad',on:{click:async()=>{await api('/invites/'+i.id,'DELETE');viewInvites()}}},'Revocar'):null)))))))}
fetch('/admin/api/overview').then(r=>r.ok?start():showLogin());
</script></body></html>
